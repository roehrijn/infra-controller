## mat-k8s-controller - Kubernetes controller for machine-a-tron BMC services
##
## This controller dynamically creates/updates/deletes Kubernetes Services
## based on machine-a-tron's /machines/status API.

## Enable/disable the controller
enabled: false

image:
  repository: mat-k8s-controller
  tag: latest
  pullPolicy: IfNotPresent

## Resource limits
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

## Controller configuration
config:
  ## Default: https://<release-name>-bmc-mock.<namespace>.svc.cluster.local:1266
  matUrl: ""

  ## Default: app.kubernetes.io/name=nico-machine-a-tron
  targetSelector: ""

  ## Reconciliation interval
  syncInterval: "30s"

  ## Skip TLS certificate verification (for self-signed certs)
  insecureSkipVerify: true

  ## Log level (debug, info, warn, error)
  logLevel: "info"

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

## Override names (useful when release name differs from chart name)
nameOverride: ""
fullnameOverride: ""

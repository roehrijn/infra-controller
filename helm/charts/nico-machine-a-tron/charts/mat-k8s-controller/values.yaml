## =============================================================================
## mat-k8s-controller - Kubernetes controller for machine-a-tron BMC services
## =============================================================================
##
## This controller dynamically creates/updates/deletes Kubernetes Services
## based on machine-a-tron's /machines/status API.
##
## Inherited from parent chart:
##   - matUrl: derived from release name + bmc-mock service
##   - namespace: inherited from release namespace
##   - targetSelector: matches parent's machine-a-tron pods
##
## =============================================================================

## Enable/disable the controller
enabled: false

image:
  repository: mat-k8s-controller
  tag: latest
  pullPolicy: IfNotPresent

## Resource limits
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

## Controller configuration
config:
  ## Reconciliation interval
  syncInterval: "30s"
  
  ## Skip TLS certificate verification (for self-signed certs)
  insecureSkipVerify: true
  
  ## Log level (debug, info, warn, error)
  logLevel: "info"
  
  ## Optional: Prefix for static ClusterIP assignment
  ## When set, controller assigns ClusterIPs using BMC IP's last two octets
  ## Example: prefix "10.96" + BMC IP "172.20.0.20" = ClusterIP "10.96.0.20"
  ## Leave empty for Kubernetes auto-assigned ClusterIPs
  clusterIpPrefix: ""

## Service account configuration
serviceAccount:
  create: true
  name: ""
  annotations: {}

## RBAC configuration
rbac:
  create: true
